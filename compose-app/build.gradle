import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'io.gitlab.arturbosch.detekt'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def buildTypeName = variant.buildType
            def nameTag = buildTypeName == "debug" ? "debug" : "release"
            def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
            def abiSuffix = variant.flavorName == "arm64" ? "-arm64-v8a" : "-universal"
            def filename = "ecto_" + (apkVersionTag ? apkVersionTag : nameTag) + abiSuffix + ".apk"
            output.outputFileName.set(filename)
        }
    }
}

android {
    namespace 'com.mrndtvndv.term'
    compileSdk project.properties.compileSdkVersion.toInteger()
    compileSdkMinor project.properties.compileSdkMinorVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    flavorDimensions += 'dist'
    productFlavors {
        arm64 {
            dimension 'dist'
            // Single-ABI arm64-v8a release APK: ~75% smaller native payload for modern devices.
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        universal {
            dimension 'dist'
            // Fat APK containing all supported ABIs (original behaviour).
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }

    defaultConfig {
        applicationId "com.mrndtvndv.term"
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode 28
        versionName "4.13.1"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }



    buildFeatures {
        compose true
    }



    packaging {
        resources {
            // Exclude signature files from Bouncy Castle to avoid packaging/signing errors
            excludes += [
                'META-INF/INDEX.LIST',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("KEYSTORE_FILE")
            if (keystoreFile) {
                def ksFile = new File(keystoreFile)
                if (!ksFile.isAbsolute()) {
                    ksFile = rootProject.file(keystoreFile)
                }
                if (ksFile.exists()) {
                    storeFile ksFile
                    storePassword System.getenv("KEYSTORE_PASSWORD")
                    keyAlias System.getenv("KEY_ALIAS")
                    keyPassword System.getenv("KEY_PASSWORD")
                }
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            packaging {
                jniLibs {
                    keepDebugSymbols += ['**/libtermux-ghostty.so']
                }
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystoreFile = System.getenv("KEYSTORE_FILE")
            if (keystoreFile) {
                def ksFile = new File(keystoreFile)
                if (!ksFile.isAbsolute()) {
                    ksFile = rootProject.file(keystoreFile)
                }
                if (ksFile.exists()) {
                    signingConfig signingConfigs.release
                } else {
                    signingConfig signingConfigs.debug
                }
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
        freeCompilerArgs.add("-opt-in=kotlin.RequiresOptIn")
    }
}

detekt {
    config = files("${rootDir}/config/detekt/detekt.yml")
    baseline = file("detekt-baseline.xml")
    buildUponDefaultConfig = true
}

ktlint {
    version.set("1.3.1")
}

dependencies {
    implementation project(':terminal-compose-view')
    implementation project(':terminal-compose-session')
    implementation project(':terminal-emulator')
    implementation project(':termux-shared')
    implementation project(':process-icons')
    implementation 'com.google.android.material:material:1.14.0'

    // Compose & Activity-Compose (versions centralized in gradle.properties)
    implementation "androidx.compose.ui:ui:$composeVersion"
    implementation "androidx.compose.material3:material3:$composeMaterial3Version"
    implementation "androidx.compose.material:material-icons-extended:$composeMaterialIconsVersion"
    implementation "androidx.activity:activity-compose:$activityVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleVersion"
    implementation "androidx.webkit:webkit:$webkitVersion"
    implementation "com.mikepenz:multiplatform-markdown-renderer-m3:$markdownRendererVersion"
    implementation "com.mikepenz:multiplatform-markdown-renderer-code:$markdownRendererVersion"
    implementation 'dev.chrisbanes.haze:haze:2.0.1'
    implementation 'dev.chrisbanes.haze:haze-blur:2.0.1'

    // Navigation 3
    implementation "androidx.navigation3:navigation3-runtime:$navigation3Version"
    implementation "androidx.navigation3:navigation3-ui:$navigation3Version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-navigation3:$lifecycleVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinxSerializationVersion"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
}

def findBunExecutable() {
    // Check explicit install locations before PATH lookup: inside
    // `nix develop` the devShell bun shadows newer installs (e.g.
    // oven-sh/setup-bun's ~/.bun/bin/bun in CI) via PATH ordering.
    def candidates = []
    def bunInstall = System.getenv("BUN_INSTALL")
    if (bunInstall) {
        candidates.add("${bunInstall}/bin/bun")
    }
    candidates.addAll([
        "${System.getProperty('user.home')}/.bun/bin/bun",
        "${System.getProperty('user.home')}/.nix-profile/bin/bun",
        "/opt/homebrew/bin/bun",
        "/usr/local/bin/bun",
        "/usr/bin/bun"
    ])
    for (String candidate : candidates) {
        def f = new File(candidate)
        if (f.exists() && f.canExecute()) return f.absolutePath
    }
    // Fall back to PATH lookup (e.g. nix devShell or system install).
    try {
        def proc = ["sh", "-c", "command -v bun"].execute()
        if (proc.waitFor() == 0) {
            def resolved = proc.text.trim()
            if (resolved && new File(resolved).canExecute()) return resolved
        }
    } catch (Exception ignored) {}
    return "bun"
}

def diffViewerDir = file("${rootDir}/tools/diff-viewer")
def diffViewerOutputDir = file("${projectDir}/src/main/assets/diff-viewer")

def assertBunAvailable = { String bunPath ->
    def bunFile = new File(bunPath)
    if (!bunFile.exists() && bunPath == "bun") {
        try {
            def check = ["which", "bun"].execute()
            if (check.waitFor() != 0) {
                throw new GradleException(
                    "Bun is required to build diff-viewer assets, but 'bun' was not found.\n" +
                    "Please install Bun (https://bun.sh) or add it to PATH."
                )
            }
        } catch (Exception e) {
            if (e instanceof GradleException) throw e
            throw new GradleException("Bun is required to build diff-viewer assets: " + e.message, e)
        }
    }
}

// Separate task because Project.exec() was removed in Gradle 9.
// A dedicated Exec task with onlyIf keeps install up-to-date and avoids
// executing another process from inside doFirst.
def installDiffViewerDeps = tasks.register('installDiffViewerDeps', Exec) {
    description = 'Installs diff-viewer dependencies using Bun'
    group = 'build'

    workingDir diffViewerDir

    inputs.file("${diffViewerDir}/package.json")
    if (file("${diffViewerDir}/bun.lock").exists()) {
        inputs.file("${diffViewerDir}/bun.lock")
    }
    outputs.dir("${diffViewerDir}/node_modules")

    def bunPath = findBunExecutable()
    executable bunPath
    args 'install', '--frozen-lockfile'

    onlyIf { !file("${diffViewerDir}/node_modules").exists() }

    doFirst {
        assertBunAvailable(bunPath)
    }
}

def buildDiffViewer = tasks.register('buildDiffViewer', Exec) {
    description = 'Compiles the diff-viewer web bundle into assets using Bun'
    group = 'build'

    workingDir diffViewerDir

    inputs.dir("${diffViewerDir}/src")
    inputs.file("${diffViewerDir}/index.html")
    inputs.file("${diffViewerDir}/package.json")
    inputs.file("${diffViewerDir}/vite.config.ts")
    if (file("${diffViewerDir}/bun.lock").exists()) {
        inputs.file("${diffViewerDir}/bun.lock")
    }

    outputs.dir(diffViewerOutputDir)

    def bunPath = findBunExecutable()
    executable bunPath
    args 'run', 'build'

    doFirst {
        assertBunAvailable(bunPath)
    }
}

buildDiffViewer.configure {
    dependsOn installDiffViewerDeps
}

tasks.named('preBuild').configure {
    dependsOn buildDiffViewer
}

tasks.register('cleanDiffViewer', Delete) {
    delete diffViewerOutputDir
}
tasks.named('clean').configure {
    dependsOn 'cleanDiffViewer'
}

// ── Herdr focus bridge ───────────────────────────────────────────────
// A Go program that runs on the SSH host (darwin/arm64). Every build compiles tools/herdr-focus-bridge, checks the
// result, and embeds it as an asset with its SHA-256 as a generated constant. Gradle reruns the compile when a Go
// source or go.mod changes, so the embedded asset cannot lag behind its sources. Requires `go` on PATH; see
// docs/fork/herdr-focus-bridge.md for the tested version.

def focusBridgeDir = file("${rootDir}/tools/herdr-focus-bridge")
def focusBridgeGenDir = file("${projectDir}/build/generated/herdrFocusBridge")
def focusBridgeBinary = file("${focusBridgeGenDir}/bin/herdr-focus-bridge")
def focusBridgeAssetRoot = file("${focusBridgeGenDir}/assets")
def focusBridgeAssetFile = file("${focusBridgeAssetRoot}/herdr-focus-bridge/darwin-arm64/herdr-focus-bridge")
def focusBridgeKotlinDir = file("${focusBridgeGenDir}/kotlin")
def focusBridgeKotlinFile = file("${focusBridgeKotlinDir}/com/mrndtvndv/term/herdr/FocusBridgeArtifact.kt")

def focusBridgeGoVersion = providers.provider {
    try {
        def probe = ["go", "version"].execute()
        def version = probe.inputStream.text.trim()
        if (probe.waitFor() == 0) return version
    } catch (IOException ignored) {
        // A missing toolchain must fail even when an earlier binary still exists in build/.
    }
    throw new GradleException(
        "Go is required to build the Herdr focus bridge (tools/herdr-focus-bridge), but 'go' was not found on PATH.\n" +
        "Install Go 1.26 and put it on PATH, then rerun the build. See docs/fork/herdr-focus-bridge.md."
    )
}

def buildFocusBridge = tasks.register('buildHerdrFocusBridge', Exec) {
    description = 'Builds the Herdr focus bridge for darwin/arm64 from tools/herdr-focus-bridge'
    group = 'build'

    workingDir focusBridgeDir
    inputs.files(fileTree(focusBridgeDir) { include '**/*.go', 'go.mod' })
    inputs.property('goToolchain', focusBridgeGoVersion)
    outputs.file(focusBridgeBinary)

    executable 'go'
    args 'build', '-trimpath', '-buildvcs=false', '-ldflags=-s -w', '-o', focusBridgeBinary.absolutePath, '.'
    environment GOOS: 'darwin', GOARCH: 'arm64', CGO_ENABLED: '0', GOTOOLCHAIN: 'local'

    doFirst {
        focusBridgeBinary.parentFile.mkdirs()
    }
}

def prepareFocusBridge = tasks.register('prepareHerdrFocusBridge') {
    description = 'Verifies the darwin/arm64 Herdr focus bridge and embeds it as an asset with a generated hash'
    group = 'build'
    dependsOn buildFocusBridge

    inputs.file(focusBridgeBinary)
    outputs.file(focusBridgeAssetFile)
    outputs.file(focusBridgeKotlinFile)

    doLast {
        def bytes = focusBridgeBinary.bytes
        // Little-endian words of the Mach-O header: magic MH_MAGIC_64 (0xFEEDFACF), then cputype CPU_TYPE_ARM64.
        def word = { int offset -> (0..3).inject(0L) { acc, i -> acc | ((bytes[offset + i] & 0xffL) << (8 * i)) } }
        if (bytes.length < 8 || word(0) != 0xFEEDFACFL) {
            throw new GradleException("${focusBridgeBinary} is not a 64-bit Mach-O file")
        }
        if (word(4) != 0x0100000CL) {
            throw new GradleException("${focusBridgeBinary} is not an arm64 binary")
        }
        def info = ["go", "version", "-m", focusBridgeBinary.absolutePath].execute()
        def buildInfo = info.inputStream.text
        if (info.waitFor() != 0 || !buildInfo.contains("GOOS=darwin") || !buildInfo.contains("GOARCH=arm64")) {
            throw new GradleException("go version -m does not report darwin/arm64 for ${focusBridgeBinary}")
        }

        def sha256 = java.security.MessageDigest.getInstance("SHA-256").digest(bytes)
            .collect { String.format("%02x", it & 0xff) }.join("")
        focusBridgeAssetFile.parentFile.mkdirs()
        focusBridgeAssetFile.bytes = bytes
        focusBridgeKotlinFile.parentFile.mkdirs()
        focusBridgeKotlinFile.text = """// Generated by compose-app/build.gradle from tools/herdr-focus-bridge. Do not edit.
package com.mrndtvndv.term.herdr

internal object FocusBridgeArtifact {
    const val ASSET_PATH = "herdr-focus-bridge/darwin-arm64/herdr-focus-bridge"
    const val SHA256 = "${sha256}"
    const val SIZE_BYTES = ${bytes.length}L
}
"""
    }
}

android.sourceSets.main.assets.srcDir(focusBridgeAssetRoot)
android.sourceSets.main.kotlin.srcDir(focusBridgeKotlinDir)

tasks.named('preBuild').configure {
    dependsOn prepareFocusBridge
}
tasks.matching { it.name.startsWith('compile') && it.name.endsWith('Kotlin') }.configureEach {
    dependsOn prepareFocusBridge
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn prepareFocusBridge
}

