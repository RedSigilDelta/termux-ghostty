## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2048M
# Reuse task outputs via the local build cache; persisted across CI runs via actions/cache
org.gradle.caching=true
android.useAndroidX=true

minSdkVersion=24
targetSdkVersion=28
ndkVersion=29.0.14206865
compileSdkVersion=37
# Compose 1.13 artifacts require minCompileMinorSdk=1 (android-37.1)
compileSdkMinorVersion=1
android.suppressUnsupportedCompileSdk=37,37.1

markwonVersion=4.6.2

# Compose/AndroidX UI stack. All modules consume this same set on purpose:
# mixing Compose artifact versions across modules breaks runtime inspection.
composeVersion=1.13.0-beta01
composeMaterial3Version=1.5.0-beta01
composeMaterialIconsVersion=1.7.8
activityVersion=1.14.0-alpha03
lifecycleVersion=2.12.0-alpha04
navigation3Version=1.3.0-alpha02
navigationEventVersion=1.2.0
markdownRendererVersion=0.46.0
webkitVersion=1.18.0-rc01
kotlinxSerializationVersion=1.12.0-RC
